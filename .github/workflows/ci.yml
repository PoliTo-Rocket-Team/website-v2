name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the fabrika version package.json pins, so CI runs the same
      # guard a local `pnpm exec fabrika` runs.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Validate the ADR corpus
        env:
          FABRIKA_GLOBAL_WARNING_DISABLED: "1"
        run: pnpm exec fabrika guard decisions-index validate

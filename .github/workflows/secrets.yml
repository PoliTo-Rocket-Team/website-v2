name: secrets

# Two scans over the files this PR adds or edits, at HEAD, in one job:
# gitleaks finds a secret, and Fabrika's leak-guard finds a machine-local path
# (/Users/<name>/..., /home/<name>/...) in a doc or shell file. No `push: dev`:
# there is no diff to read there. Each scan fails closed on every non-zero exit,
# and the job fails when either does.
#
# No `paths` filter: a docs-only push still gets this check, so a PR head never
# has no check at all. It also runs on `merge_group`; a queue run diffs from
# `merge_group.base_sha`.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba" # gitleaks_8.21.2_linux_x64.tar.gz

jobs:
  scan:
    name: scan PR files for secrets and machine-local paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs the fabrika version package.json pins, so
      # CI runs the same guard a local `pnpm exec fabrika` runs.
      - run: pnpm install --frozen-lockfile

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          (cd "$RUNNER_TEMP" && echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c - && tar -xzf "$tarball" gitleaks)
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan changed files
        env:
          BASE_REF: ${{ github.base_ref }}
          # Set only on a merge queue run, where github.base_ref is empty.
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          FABRIKA_GLOBAL_WARNING_DISABLED: "1"
        run: |
          set -uo pipefail
          if [ -n "$QUEUE_BASE_SHA" ]; then
            base="$QUEUE_BASE_SHA"
          elif [ -n "$BASE_REF" ] && git fetch --no-tags origin "$BASE_REF"; then
            base="origin/$BASE_REF"
          else
            echo "::error::no base to diff against — refusing to report clean over nothing."
            exit 1
          fi
          # NUL-delimited, so a path such as `café.md` arrives as itself
          # rather than as Git's quoted octal escape.
          list="$RUNNER_TEMP/changed"
          if ! git diff -z --name-only --diff-filter=ACMR "$base...HEAD" > "$list"; then
            echo "::error::could not diff $base...HEAD — refusing to report clean over nothing."
            exit 1
          fi
          changed=()
          while IFS= read -r -d '' f; do if [ -n "$f" ]; then changed+=("$f"); fi; done < "$list"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No changed files — nothing to scan."
            exit 0
          fi
          printf 'Scanning %d changed file(s):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"

          failed=0

          echo "::group::gitleaks"
          staging="$(mktemp -d)"
          for f in "${changed[@]}"; do
            mkdir -p "${staging}/$(dirname -- "$f")" && cp -P -- "$f" "${staging}/${f}" || { echo "::error::could not stage ${f}"; exit 1; }
          done
          if "$RUNNER_TEMP/gitleaks" dir "$staging" --config=.gitleaks.toml --no-banner --redact --exit-code 3; then
            code=0
          else
            code=$?
          fi
          case "$code" in
            0) echo "gitleaks: clean." ;;
            3) echo "::error::gitleaks found a secret in a file this PR adds or edits. Remove it, rotate it, never allowlist a real secret."; failed=1 ;;
            *) echo "::error::gitleaks exit ${code} — treating as fail-closed."; failed=1 ;;
          esac
          echo "::endgroup::"

          echo "::group::leak-guard"
          if ! pnpm exec fabrika guard leak-guard scan "${changed[@]}"; then
            echo "::error::leak-guard failed — a changed file names a machine-local path, or the scan could not run."
            failed=1
          fi
          echo "::endgroup::"

          exit "$failed"
